[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "defog-adapt"
# Development version. The first release is 0.1.0; it is set when the release gate passes.
version = "0.1.0.dev0"
description = "Frozen-base adapters, Feynman-Kac steering and RL fine-tuning for DeFoG discrete flow matching on graphs (molecules)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Jonas Teufel", email = "jonseb1998@gmail.com" },
]
requires-python = ">=3.10"
keywords = [
    "graph generation", "flow matching", "discrete flow matching", "molecular generation",
    "conditional generation", "adapters", "reinforcement learning", "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
]

# Import-time truth for ``import defog_adapt``. Every lower bound below was TESTED: the full suite
# passes with all of them installed at exactly these versions (Python 3.10; the chem extra included).
# Two of them are higher than they look because of what was found doing that:
#   * pytorch_lightning>=2.4: 2.0-2.3 import ``pkg_resources`` (gone from setuptools >= 81), so
#     they cannot be imported in a current environment at all.
#   * torch>=2.1: what pytorch_lightning 2.4 itself requires, so the floors have to move together.
#   * matplotlib>=3.5.3: 3.5.0 crashes on import under some Python builds (a Tk probe).
dependencies = [
    "torch>=2.1",
    "torch_geometric>=2.3",
    "pytorch_lightning>=2.4",
    "numpy>=1.23",
    "tqdm>=4.60",
    "matplotlib>=3.5.3",
    # The reference-split loaders (ZINC250k, MOSES) read CSVs with pandas.
    "pandas>=1.4",
    # TrainingMonitorCallback samples host and GPU load with these. It works without either (it just records
    # less), so neither has a tested floor. nvidia-ml-py provides the ``pynvml`` module: the PyPI package
    # called ``pynvml`` is deprecated and warns on every import.
    "psutil",
    "nvidia-ml-py",
]

[project.optional-dependencies]
# RDKit is a large compiled dependency and the core is domain-agnostic graph code, so the molecular domain is the
# one extra. Everything with a recorded result is molecular, so most users want it.
chem = ["rdkit>=2023.3.1", "pillow>=9", "scipy>=1.10"]

# Contributor tools: not part of what users install, so a dependency group (PEP 735) and not an extra.
#   uv pip install -e ".[chem]" --group dev      (pip 25.1 or newer: pip install -e ".[chem]" --group dev)
# The recipes under examples/ also need PyComex. It is not a dependency, because it caps numpy below 2 and so
# would hold every user of this package on numpy 1.x; install it, in an environment of its own if you want numpy 2
# elsewhere. The floor the recipes' smoke tests were run on is pycomex 0.13.1.
[dependency-groups]
dev = ["pytest>=7", "pytest-xdist", "build", "twine"]

[project.urls]
Homepage = "https://github.com/aimat-lab/defog-adapt"
Repository = "https://github.com/aimat-lab/defog-adapt"
Upstream = "https://github.com/qym7/DeFoG"

[tool.hatch.build.targets.wheel]
packages = ["src/defog_adapt"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/CLAUDE.md",
    "/LICENSE",
    "/NOTICE",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
markers = [
    "slow: trains a small model (deselect with '-m \"not slow\"')",
    "parity: compares against golden outputs of the research repo; needs DEFOG_ADAPT_CKPTS (opt-in)",
]
