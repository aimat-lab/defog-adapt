[build-system]
# hatch-fancy-pypi-readme builds the long description that PyPI shows (see [tool.hatch.metadata.hooks.fancy-pypi-readme]).
requires = ["hatchling", "hatch-fancy-pypi-readme>=22.8.0"]
build-backend = "hatchling.build"

[project]
name = "defog-adapt"
# The one source of the version: defog_adapt.__version__ reads it back from the installed metadata. CITATION.cff and the
# top entry of CHANGELOG.md change with it.
version = "0.1.0"
description = "Frozen-base adapters, Feynman-Kac steering and RL fine-tuning for DeFoG discrete flow matching on graphs (molecules)."
# The long description is README.md with its relative paths made absolute: see [tool.hatch.metadata.hooks.fancy-pypi-readme].
dynamic = ["readme"]
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Jonas Teufel", email = "jonseb1998@gmail.com" },
]
requires-python = ">=3.10"
keywords = [
    "graph generation", "flow matching", "discrete flow matching", "molecular generation",
    "conditional generation", "adapters", "reinforcement learning", "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
]

# Import-time truth for ``import defog_adapt``. Every lower bound below was TESTED: the full suite
# passes with all of them installed at exactly these versions (Python 3.10; the chem extra included).
# Two of them are higher than they look because of what was found doing that:
#   * pytorch_lightning>=2.4: 2.0-2.3 import ``pkg_resources`` (gone from setuptools >= 81), so
#     they cannot be imported in a current environment at all.
#   * torch>=2.1: what pytorch_lightning 2.4 itself requires, so the floors have to move together.
#   * matplotlib>=3.5.3: 3.5.0 crashes on import under some Python builds (a Tk probe).
dependencies = [
    "torch>=2.1",
    "torch_geometric>=2.3",
    "pytorch_lightning>=2.4",
    "numpy>=1.23",
    "tqdm>=4.60",
    "matplotlib>=3.5.3",
    # The reference-split loaders (ZINC250k, MOSES) read CSVs with pandas.
    "pandas>=1.4",
    # TrainingMonitorCallback samples host and GPU load with these. It works without either (it just records
    # less), so neither has a tested floor. nvidia-ml-py provides the ``pynvml`` module: the PyPI package
    # called ``pynvml`` is deprecated and warns on every import.
    "psutil",
    "nvidia-ml-py",
]

[project.optional-dependencies]
# RDKit is a large compiled dependency and the core is domain-agnostic graph code, so the molecular domain is the
# one extra. Everything with a recorded result is molecular, so most users want it.
chem = ["rdkit>=2023.3.1", "pillow>=9", "scipy>=1.10"]

# Contributor tools: not part of what users install, so a dependency group (PEP 735) and not an extra.
#   uv pip install -e ".[chem]" --group dev      (pip 25.1 or newer: pip install -e ".[chem]" --group dev)
# The recipes under examples/ also need PyComex. It is not a dependency, because it caps numpy below 2 and so
# would hold every user of this package on numpy 1.x; install it, in an environment of its own if you want numpy 2
# elsewhere. The floor the recipes' smoke tests were run on is pycomex 0.13.1.
[dependency-groups]
# hatchling and hatch-fancy-pypi-readme let tests/test_pypi_readme.py build the package without network access.
dev = ["pytest>=7", "pytest-xdist", "build", "twine", "hatchling", "hatch-fancy-pypi-readme>=22.8.0"]
# The documentation site. No torch: the site is hand-written pages, with nothing generated from the package.
# `mkdocs<2` because MkDocs 2.0 will not run Material sites; see mkdocs.yml.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.6,<10"]

[project.urls]
Homepage = "https://github.com/aimat-lab/defog-adapt"
Documentation = "https://aimat-lab.github.io/defog-adapt/"
Repository = "https://github.com/aimat-lab/defog-adapt"
Changelog = "https://github.com/aimat-lab/defog-adapt/blob/main/CHANGELOG.md"
Issues = "https://github.com/aimat-lab/defog-adapt/issues"
Upstream = "https://github.com/qym7/DeFoG"

# What PyPI shows on the project page is README.md, but only its text: PyPI cannot resolve a path in the repository, so
# docs/guides/x.md, LICENSE and the images under docs/assets/ would be dead links and broken pictures. The README in the
# repository keeps its relative paths, which GitHub and a clone want; when the package is built, these rules turn each
# one into an absolute URL on GitHub's `main` branch. A link within the README (#anchor) stays as it is: PyPI gives the
# headings ids and points the link at them. They run in this order, and tests/test_pypi_readme.py builds the package and
# checks that no relative target is left and that nothing but targets changed.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# An image needs the file itself (raw.githubusercontent.com), a link needs the page that GitHub draws (blob/main).
# A markdown image, ![alt](path):
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(!\[[^\]]*\]\()(?!https?://|data:)([^)\s]+)\)'
replacement = '\g<1>https://raw.githubusercontent.com/aimat-lab/defog-adapt/main/\g<2>)'

# An html image or picture source: src="path" and srcset="path".
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(\b(?:src|srcset)=")(?!https?://|data:)([^"]+)"'
replacement = '\g<1>https://raw.githubusercontent.com/aimat-lab/defog-adapt/main/\g<2>"'

# A markdown link, [text](path) or [text](path#anchor):
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(\]\()(?!https?://|mailto:|#)([^)\s]+)\)'
replacement = '\g<1>https://github.com/aimat-lab/defog-adapt/blob/main/\g<2>)'

# An html link, href="path":
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(\bhref=")(?!https?://|mailto:|#)([^"]+)"'
replacement = '\g<1>https://github.com/aimat-lab/defog-adapt/blob/main/\g<2>"'

[tool.hatch.build.targets.wheel]
packages = ["src/defog_adapt"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/mkdocs.yml",
    "/README.md",
    "/CLAUDE.md",
    "/LICENSE",
    "/NOTICE",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
markers = [
    "slow: trains a small model (deselect with '-m \"not slow\"')",
    "parity: compares against golden outputs of the research repo; needs DEFOG_ADAPT_CKPTS (opt-in)",
]
