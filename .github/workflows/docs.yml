name: Docs

# Builds the documentation site on every push to main and every pull request, and fails on a broken link, a missing
# snippet or a page that is not in the nav (`mkdocs build --strict`).
#
# PUBLISHING IS DORMANT. GitHub Pages serves a private repository only on Enterprise Cloud, and a free organisation gets
# Pages for public repositories only, so nothing can be published yet. When the repository is public: enable Pages
# (Settings, Pages, Source: GitHub Actions), then either run this workflow by hand with "deploy" ticked, or set the
# repository variable DOCS_DEPLOY to "true" to publish on every push to main. Nothing else needs to change.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the built site to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  # MkDocs 1.x prints a banner about MkDocs 2.0 on every run. This site pins mkdocs<2 on purpose (see mkdocs.yml).
  NO_MKDOCS_2_WARNING: "1"

jobs:
  build:
    name: build the site (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml   # there is no requirements.txt to hash
      - name: Install the docs dependencies (hand-written pages, so no PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install --group docs
      - name: Build, failing on any warning
        run: mkdocs build --strict
      - name: Keep the built site (published only by the deploy job below)
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: publish to GitHub Pages
    needs: build
    # Only ever from main, and only on purpose: a ticked box on a manual run, or the DOCS_DEPLOY variable on a push.
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.deploy) ||
       (github.event_name == 'push' && vars.DOCS_DEPLOY == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
