name: Release

# Nothing here publishes by accident. A pushed version tag (v*) builds the sdist and the wheel, checks them with
# `twine check` and keeps them as the `dist` artifact of the run; a manual run does the same and nothing more, so it is
# a dry run of the build. There is no test index: only the maintainer's PyPI account exists.
#
# Uploading is a decision of the maintainer. Either upload the run's `dist` artifact by hand (gh run download, then
# uv publish with the maintainer's PyPI token), or let the job below do it with PyPI Trusted Publishing (OpenID
# Connect, no token in this repository or its secrets). The job is dormant until all three are set up:
#   1. on PyPI, a trusted publisher for the project defog-adapt: this repository, workflow release.yml, environment pypi
#   2. in the repository settings, the environment `pypi`, protected by a required reviewer so that a release waits
#      for a human
#   3. the repository variable PYPI_TRUSTED_PUBLISHING set to "true"
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    # Only a pushed version tag reaches the index (a manual run is on a branch), and only once Trusted Publishing is set up.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_TRUSTED_PUBLISHING == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/defog-adapt
    permissions:
      id-token: write            # Trusted Publishing: the OIDC token, not a stored secret
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
